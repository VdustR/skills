name: Validate Latest Skills CLI

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  validate-latest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check latest skills CLI compatibility
        run: npm run validate:latest
