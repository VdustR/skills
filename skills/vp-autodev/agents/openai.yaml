interface:
  display_name: "AUTO Development"
  short_description: "Own an authorized change through delivery"
  default_prompt: "Use $vp-autodev to validate the task, diagnose failures, decide delivery units, and maintain one confirmation checklist in the delivery brief: resolve unknowns and required communication before implementation and integration, create tracking issues by default for confirmed non-blockers or explicitly retain bounded session TODOs that block BYE, and use vp-retro for differences between checkpoints. Verify the change and deliver through commit, PR, feedback, and the repository's authorized terminal state (merge plus release follow-up, or a Ready PR) when policy, verification, and risk permit."
