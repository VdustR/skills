interface:
  display_name: "VP Session Wrap-Up"
  short_description: "Preserve results and reclaim temporary session resources"
  default_prompt: "Use $vp-session-wrapup for BYE if no risk or todo: read any vp-autodev confirmation checklist and retained session TODOs, verify session blockers and concrete feasible actions before deciding; distinguish uncontrollable waiting from action; offer AUTO Flow for remaining scope unless already authorized. Preserve and verify required results and delivery, reclaim session-owned temporary files, generated artifacts and runtime resources, remove redundant local copies after verified external release, and retain permanent local installations and their runtime dependencies. Verify cleanup and preservation separately. When otherwise ready to close, check for actionable improvements and use $vp-retro for qualifying candidates. Lead with the applicable BYE flow verdict in the reply language and report archival separately. Before archiving a delegated session, verify authorization, acceptance, preservation, and archive readback."
