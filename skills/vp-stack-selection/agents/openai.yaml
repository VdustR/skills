interface:
  display_name: "VP Stack Selection"
  short_description: "Compare ecosystems against project requirements"
  default_prompt: "Use $vp-stack-selection to compare fitting ecosystems and credible prereleases, prefer Bun-first for new JS/TS projects with bun test and bun check, keep one toolchain per monorepo, and switch the whole repository to Node.js + pnpm only for necessary constraints without a reasonable verified solution. Prefer compatible mise version management, TypeScript source, strictest, application-owned ts-reset, and framework-aware checking; retain native Node execution and tsx guidance for selected Node stacks. Prefer Astro for new static and marketing websites and Astro with Starlight for documentation websites, checking delivery format and application-state boundaries. Read the diagram-rendering, syntax-highlighting, and internationalization guides when relevant."
